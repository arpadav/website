<div id="sidebar" class="sidebar">
    <!-- -------------------------------------------------- -->
    <!-- include the gator -->
    <!-- -------------------------------------------------- -->
    <li>
        <a href="/gator/" target="_parent">
            <img src="/images/alligator.png" />
        </a>
    </li>
    <!-- -------------------------------------------------- -->
    <!-- match the type of sidebar, include that template -->
    <!-- -------------------------------------------------- -->
    {% match sidebar %} {% when SidebarType::Projects %}
    <!-- -------------------------------------------------- -->
    <!-- project links in the sidebar -->
    <!-- -------------------------------------------------- -->
    {% include "projects/project-sidebar.html" %}
    <!-- -------------------------------------------------- -->
    <!-- do nothing -->
    <!-- -------------------------------------------------- -->
    {% when SidebarType::Posts %}
    <!-- -------------------------------------------------- -->
    <!-- post links in the sidebar -->
    <!-- -------------------------------------------------- -->
    {% include "posts/posts-sidebar.html" %}
    <!-- -------------------------------------------------- -->
    <!-- do nothing -->
    <!-- -------------------------------------------------- -->
    {% when SidebarType::GatorOnly %}
    <!-- -------------------------------------------------- -->
    <!-- add more if needed -->
    <!-- -------------------------------------------------- -->
    {% endmatch %}
</div>
<!-- -------------------------------------------------- -->
<!-- on mobile, alligator toggles the navbar instead of  -->
<!-- navigating to /gator/                               -->
<!-- -------------------------------------------------- -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var gator = document.querySelector("#sidebar > li:first-child a");
        var nav = document.getElementById("navbar");
        if (!gator || !nav) return;
        gator.setAttribute("aria-controls", "navbar");
        gator.setAttribute("aria-expanded", "true");
        gator.addEventListener("click", function (e) {
            if (!window.matchMedia("(max-width: 768px)").matches) return;
            e.preventDefault();
            nav.classList.toggle("collapsed");
            gator.setAttribute(
                "aria-expanded",
                String(!nav.classList.contains("collapsed")),
            );
        });
    });
</script>
