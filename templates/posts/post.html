<!doctype html>
<html>
    <!-- -------------------------------------------------- -->
    <!-- include header -->
    <!-- -------------------------------------------------- -->
    <head>
        {% include "general/header.html" %}
    </head>
    <!-- -------------------------------------------------- -->
    <!-- include sidebar (gator, floats left)                -->
    <!-- -------------------------------------------------- -->
    {% include "general/sidebar.html" %}
    <!-- -------------------------------------------------- -->
    <!-- toc sidebar (top-level, floats right so beside-     -->
    <!-- sidebar can sit between gator and toc as a 3-col    -->
    <!-- layout: gator | content+nav | toc). must appear     -->
    <!-- before .beside-sidebar in source for floats to lay  -->
    <!-- out correctly.                                      -->
    <!-- -------------------------------------------------- -->
    {% if !toc.is_empty() %}
    <nav class="posts-toc">
        <p>table of contents</p>
        <ul>
            {% for entry in toc %}
            <li class="toc-h{{ entry.level }}">
                <a href="#{{ entry.id }}">{{ entry.text }}</a>
            </li>
            {% endfor %}
        </ul>
    </nav>
    {% endif %}
    <!-- -------------------------------------------------- -->
    <!-- navbar + post content (middle column)               -->
    <!-- -------------------------------------------------- -->
    <div class="beside-sidebar{% if !toc.is_empty() %} has-toc{% endif %}">
        {% include "general/navbar.html" %}
        <article class="posts-post">
            <header class="posts-post-header">
                <h1>{{ post_title }}</h1>
                <time class="posts-post-date">{{ date }}</time>
            </header>
            <hr />
            <div class="posts-post-body md">{{ content|safe }}</div>
        </article>
        <br />
    </div>
    <!-- -------------------------------------------------- -->
    <!-- stylesheets -->
    <!-- -------------------------------------------------- -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/posts.css" />
    <!-- -------------------------------------------------- -->
    <!-- anchor link copy-to-clipboard -->
    <!-- -------------------------------------------------- -->
    <script>
        document.querySelectorAll(".anchor-icon").forEach(function (el) {
            el.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                var url =
                    window.location.href.split("#")[0] +
                    "#" +
                    el.closest("[id]").id;
                navigator.clipboard.writeText(url);
            });
        });
    </script>
</html>
