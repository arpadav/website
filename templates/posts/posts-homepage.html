<!doctype html>
<html>
    <!-- -------------------------------------------------- -->
    <!-- include header -->
    <!-- -------------------------------------------------- -->
    <head>
        {% include "general/header.html" %}
    </head>
    <!-- -------------------------------------------------- -->
    <!-- include sidebar -->
    <!-- -------------------------------------------------- -->
    {% include "general/sidebar.html" %}
    <!-- -------------------------------------------------- -->
    <!-- navbar + listing (inside .beside-sidebar so title   -->
    <!-- sits beside the sidebar instead of below it)        -->
    <!-- -------------------------------------------------- -->
    <div class="beside-sidebar">
        {% include "general/navbar.html" %}
        <div class="posts-listing">
            <h1>arpad posts</h1>
            <p>thoughts, ideas, and longer-form writing</p>
            <hr />
            <!-- -------------------------------------------------- -->
            <!-- loop through posts, newest first -->
            <!-- -------------------------------------------------- -->
            {% for post in posts %}
            <a href="{{ post.url }}" class="posts-entry no-underline">
                <div class="posts-entry-inner">
                    <h2>{{ post.title }}</h2>
                    <p class="posts-date">{{ post.date }}</p>
                </div>
            </a>
            {% if !loop.last %}
            <hr />
            {% endif %} {% endfor %}
        </div>
    </div>
    <base target="_top" />
    <!-- -------------------------------------------------- -->
    <!-- stylesheets -->
    <!-- -------------------------------------------------- -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/posts.css" />
</html>
