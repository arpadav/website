{% for post in crate::posts::POSTS_META.iter() %}
<li>
    <a href="{{ post.url }}" target="_parent">
        <i>{{ post.title.sidebar_title() }}</i>
    </a>
</li>
{% if !loop.last %}
<li class="sep">§</li>
{% endif %} {% endfor %}
